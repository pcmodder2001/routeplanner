{% extends "base.html" %}
{% block title %}Sign in · Route Planner{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-card panel">
  <h1>Sign in</h1>
  <p class="lede">Your jobs and routes stay on your account.</p>
  <form method="post" class="stack" action="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label class="field">
      <span>Username</span>
      {{ form.username }}
    </label>
    <label class="field">
      <span>Password</span>
      {{ form.password }}
    </label>
    <label class="remember">
      {{ form.remember_me }}
      <span>Remember me for 90 days</span>
    </label>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
