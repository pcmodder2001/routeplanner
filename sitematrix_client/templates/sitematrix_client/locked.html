<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ site_name }} — Unavailable</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #f3efe6 0%, #e7eef2 55%, #dfe8f0 100%);
      color: #1c2430;
    }
    main {
      width: min(32rem, calc(100% - 2rem));
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(28, 36, 48, 0.08);
      box-shadow: 0 18px 50px rgba(28, 36, 48, 0.08);
    }
    p { margin: 0 0 0.75rem; line-height: 1.5; }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.75rem;
      font-family: system-ui, sans-serif;
      color: #5b6573;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 500;
    }
    .hint {
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      color: #5b6573;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Temporarily offline</p>
    <h1>{{ site_name }}</h1>
    <p>This website is temporarily unavailable.</p>
    <p class="hint">If you are the site owner, check SiteMatrix billing and site status.</p>
  </main>
</body>
</html>
