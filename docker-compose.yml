services:
  routeplanner:
    build: .
    image: routeplanner:latest
    container_name: routeplanner
    # Same as other SiteMatrix services — proxy reaches this via 127.0.0.1:8889
    network_mode: host
    environment:
      PORT: "8889"
      DEBUG: "0"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "https://plan.sitematrix.co.uk,http://localhost:8889,http://127.0.0.1:8889"
      SQLITE_PATH: /data/db.sqlite3
      USE_X_FORWARDED_PROTO: "1"
      # Optional — only needed if you want SiteMatrix live/offline gating.
      SITEMATRIX_API_URL: "${SITEMATRIX_API_URL:-https://www.sitematrix.co.uk}"
      SITEMATRIX_API_KEY: "${SITEMATRIX_API_KEY:-}"
      SITEMATRIX_FAIL_OPEN: "${SITEMATRIX_FAIL_OPEN:-1}"
      SITEMATRIX_SITE_NAME: "${SITEMATRIX_SITE_NAME:-Route Planner}"
      SITEMATRIX_TIMEOUT: "${SITEMATRIX_TIMEOUT:-3}"
      # Optional: traffic-aware times (Google) or ORS road times
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      OPENROUTESERVICE_API_KEY: "${OPENROUTESERVICE_API_KEY:-}"
      # Optional: list every address at a UK postcode (Ideal Postcodes / Royal Mail PAF)
      # getAddress.io shut down Feb 2026 — use IDEAL_POSTCODES_API_KEY instead
      IDEAL_POSTCODES_API_KEY: "${IDEAL_POSTCODES_API_KEY:-}"
      GETADDRESS_API_KEY: "${GETADDRESS_API_KEY:-}"
    volumes:
      - routeplanner_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8889/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  routeplanner_data:
